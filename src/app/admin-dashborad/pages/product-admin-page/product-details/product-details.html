<h1 class="text-2xl font-bold">{{ product().title }}</h1>
<div class="divider"></div>
<form class="flex flex-col gap-4" [formGroup]="productFrom" (ngSubmit)="onSubmit()">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <!-- Datos generales -->
    <div class="flex flex-col gap-2">
      <h2 class="text-2xl font-bold h-12">Datos generales</h2>
      <input
        type="text"
        placeholder="Título"
        class="input input-bordered w-full"
        formControlName="title"
        [class.border-red-500]="productFrom.get('title')?.errors ?? false"
      />

      <app-form-error-label [control]="productFrom.get('title')!" />

      <input
        type="text"
        placeholder="Slug"
        class="input input-bordered w-full"
        formControlName="slug"
      />

      <textarea
        class="textarea textarea-bordered"
        placeholder="Descripción"
        rows="6"
        formControlName="description"
      ></textarea>

      <h2 class="text-lg font-bold">Datos de venta</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <input
          type="number"
          placeholder="Precio"
          class="input input-bordered w-full"
          formControlName="price"
        />

        <input
          type="number"
          placeholder="Inventario"
          class="input input-bordered w-full"
          formControlName="stock"
        />
      </div>

      <!-- tags -->
      <input
        type="text"
        placeholder="Tags"
        class="input input-bordered w-full"
        formControlName="tags"
      />

      <!-- Botones para el género -->
      <div class="grid grid-cols-3 gap-2">
        <!-- <button class="btn btn-sm btn-outline">Masculino</button> -->
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-primary]="productFrom.value.gender === 'men'"
        >
          Masculino
        </button>
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-accent]="productFrom.value.gender === 'women'"
        >
          Femenino
        </button>
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-secondary]="productFrom.value.gender === 'unisex'"
        >
          Unisex
        </button>
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-warning]="productFrom.value.gender === 'kid'"
        >
          Kid
        </button>
      </div>

      <!-- <select class="select select-bordered w-full">
      <option value="male">Masculino</option>
      <option value="female">Femenino</option>
      <option value="unisex">Unisex</option>
    </select> -->

      <!-- Sizes -->
      <div class="grid grid-cols-6 gap-2">
        @for (size of sizes; track size) {
          <button
            type="button"
            class="btn btn-sm btn-accent"
            [class.btn-primary]="productFrom.value.sizes?.includes(size)"
            (click)="sizeClick(size)"
          >
            {{ size }}
          </button>
        }
      </div>
    </div>

    <!-- Imágenes -->
    <div class="flex flex-col gap-2">
      <div class="flex justify-end h-12">
        <button class="btn btn-secondary" type="submit">
          <!-- <span class="loading loading-spinner loading-sm"></span> -->

          Guardar
        </button>
      </div>

      <app-product-carusel [imagenes]="imagenesCarusel()" />

      <input
        type="file"
        multiple
        accept="image/*"
        class="file-input file-input-bordered w-full mt-4"
        (change)="onFilesChanged($event)"
        #fileImagen
      />

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          @for (imagen of tempImages(); track $index) {
            <img [src]="imagen" title="imagen temporal" class="w-full h-32 object-cover rounded shadow" />
          }
      </div>

    </div>
  </div>
</form>

@if (wasSaved()) {
  <div class="alert alert-success fixed top-4 right-4 w-80 animate-bounce">
    <span>Datos Actualizados correctamente</span>
  </div>
}
