<h1 class="text-2xl font-bold">Listado de Productos</h1>
<h3 class="text-lg">
  Total de Productos
  <span class="text-accent">{{productAdminResouces.value()?.count ?? 0}}</span>
</h3>

<div class="divider"></div>
<div class="flex grid-cols-2 gap-2 items-center h-20">
  <app-pagination [pages]="pages()" [currentPage]="paginationServices.currentPage()" />
  <select class="select select-primary select-bordered text-taupe-950 bg-purple-200"
  (change)="limit.set(+selectPerpage.value)"
  #selectPerpage

  >
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>

  <div class="flex flex-1" ></div>

  <button class="btn btn-primary" routerLink="/admin/product/new">
    new Product
  </button>

</div>

<app-product-table [products]="productAdminResouces.value()?.products!" />
