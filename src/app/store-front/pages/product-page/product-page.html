@if (productResource.isLoading()) {
  <div class="flex justify-center items-center h-screen">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
}

@if (productResource.hasValue()) {
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

    <app-product-carusel [imagenes]="productResource.value()?.images" />

    <div>
      <h1 class="text-2xl font-bold font-montserrat">Producto : {{ productResource.value()?.title }}</h1>
      <div class="divider-accent"></div>
      <span>
        <p class="">{{ productResource.value()?.description }}</p>
      </span>
    </div>
  </div>
}
